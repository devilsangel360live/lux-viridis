###############################################################################
# Lux Viridis — OMV deployment
#
# Two services and no database container: SQLite is a file on a bind mount,
# which for two writers is faster than Postgres and reduces the whole backup
# story to "copy one file".
#
# No cloudflared here. This assumes you already run one as its own service —
# alongside calibre-web, Kavita and the rest — so the tunnel routes to this app
# by host IP and port, exactly like your other hostnames. See README for the
# Public Hostname value to enter in the Cloudflare dashboard.
#
#   docker compose up -d --build
###############################################################################

services:
  app:
    build: .
    image: lux-viridis:latest
    container_name: lux-viridis
    restart: unless-stopped
    environment:
      DATABASE_FILE: /data/lux.db
      # Traffic arrives at Cloudflare over HTTPS, which is what makes the
      # session cookie's `secure` flag correct — even though the last hop from
      # cloudflared to this container is plain HTTP on the LAN.
      NODE_ENV: production
    volumes:
      # Point LUX_DATA_DIR at a path on your OMV pool, e.g.
      #   LUX_DATA_DIR=/srv/dev-disk-by-uuid-xxxx/appdata/lux/data
      - ${LUX_DATA_DIR:-./data}:/data
    ports:
      # Published on the host so an externally-managed cloudflared can reach it.
      # Change the left-hand side if 3000 is already taken on the box; only that
      # number goes in the tunnel's Public Hostname.
      - "${LUX_PORT:-3000}:3000"

  # Nightly copy of the database to the host. sqlite3 .backup is used rather
  # than cp because it is safe against a live writer — copying the file while a
  # transaction is in flight can capture a torn state.
  backup:
    image: alpine:3.20
    container_name: lux-backup
    restart: unless-stopped
    volumes:
      - ${LUX_DATA_DIR:-./data}:/data:ro
      - ${LUX_BACKUP_DIR:-./backups}:/backups
    command: >
      sh -c "apk add --no-cache sqlite >/dev/null &&
             while true; do
               ts=$$(date +%Y%m%d-%H%M%S);
               sqlite3 /data/lux.db \".backup '/backups/lux-$$ts.db'\" &&
               echo \"[backup] wrote lux-$$ts.db\" ||
               echo '[backup] FAILED';
               ls -1t /backups/lux-*.db 2>/dev/null | tail -n +15 | xargs -r rm --;
               sleep 86400;
             done"
